<html lang="nl">
<head>

<title>Werkuren test</title>
<style>
  :root {
    --navy: #17365d; --navy-2: #dbeafe; --green: #176b45; --bg: #f1f5f9; --card: #ffffff;
    --line: #d5dde8; --text: #14202e; --muted: #64748b; --danger: #b42318;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0e1620; --card: #17222f; --line: #2b3a4c; --text: #e8eef5; --muted: #93a4b8; --green: #5fd09a; --danger: #ff8a7a; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; font-size: 16px; }
  header { background: var(--navy); color: #fff; padding: calc(env(safe-area-inset-top, 0px) + 14px) 18px 14px; }
  header h1 { margin: 0; font-size: 22px; letter-spacing: .2px; }
  header p { margin: 3px 0 0; font-size: 13px; color: var(--navy-2); }
  main { max-width: 560px; margin: 0 auto; padding: 14px 14px calc(env(safe-area-inset-bottom, 0px) + 30px); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  .weeknav { display: flex; align-items: center; gap: 8px; }
  .weeknav .label { flex: 1; text-align: center; font-weight: 700; font-size: 15px; }
  button { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--text);
    border-radius: 10px; padding: 10px 14px; min-height: 44px; }
  button:active { transform: scale(.98); }
  button.primary { background: var(--navy); color: #fff; border-color: var(--navy); font-weight: 600; }
  @media (prefers-color-scheme: dark) { button.primary { background: #2c5a94; border-color: #2c5a94; } }
  button.link { border: 0; background: none; color: var(--muted); text-decoration: underline; min-height: 36px; padding: 6px; }
  .today-btn { width: 100%; margin-top: 8px; }
  .day { border: 1px solid var(--line); border-radius: 12px; margin-bottom: 8px; background: var(--card); overflow: hidden; }
  .day.open { border-color: var(--navy); box-shadow: 0 0 0 1px var(--navy); }
  .day-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; width: 100%; text-align: left;
    border: 0; border-radius: 0; background: none; min-height: 56px; }
  .day-head .name { font-weight: 700; }
  .day-head .date { color: var(--muted); font-size: 13px; }
  .day-head .spacer { flex: 1; }
  .day-head .times { font-size: 14px; color: var(--muted); }
  .day-head .hours { font-weight: 700; min-width: 52px; text-align: right; }
  .day-head .hours.zero { color: var(--muted); font-weight: 400; }
  .day.today .name::after { content: " ●"; color: var(--green); font-weight: 600; font-size: 12px; }
  .editor { padding: 0 14px 14px; border-top: 1px solid var(--line); }
  .editor label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
  .row2 { display: flex; gap: 10px; }
  .row2 > div { flex: 1; }
  input, textarea { width: 100%; font: inherit; font-size: 17px; /* 17px avoids iOS zoom on focus */
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--bg); color: var(--text); }
  textarea { min-height: 84px; resize: vertical; }
  input:focus, textarea:focus { outline: 2px solid var(--navy); outline-offset: 0; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .err { color: var(--danger); font-size: 13px; margin-top: 4px; min-height: 0; }
  .saved { font-size: 12px; color: var(--green); margin-top: 10px; display: flex; justify-content: space-between; align-items: center; }
  .totals { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .totals .big { font-size: 18px; font-weight: 700; }
  .totals .pay { color: var(--green); }
  .rate-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 14px; color: var(--muted); }
  .rate-row input { width: 90px; font-size: 16px; text-align: right; padding: 6px 10px; }
  h2 { font-size: 15px; margin: 0 0 6px; }
  .sync p { margin: 4px 0 10px; font-size: 14px; color: var(--muted); line-height: 1.4; }
  .sync .btns { display: flex; flex-direction: column; gap: 8px; }
  .toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); transform: translateX(-50%);
    background: #111c2a; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px; opacity: 0;
    pointer-events: none; transition: opacity .2s; max-width: 90%; text-align: center; }
  .toast.show { opacity: 1; }
  .install { font-size: 13px; color: var(--muted); line-height: 1.4; display: none; }
.day-head{display:block;padding:10px 12px;min-height:0}
.day-head .top{display:flex;align-items:baseline;gap:8px}.day-head .sp{flex:1}
.day-head .pay{color:var(--green);font-weight:700;min-width:72px;text-align:right}
.day-head .sub{font-size:13px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chips button{min-height:34px;padding:4px 10px;border-radius:999px;font-size:14px}
.toast.act{pointer-events:auto}.toast button{margin-left:12px;background:none;border:0;color:#7fd3a8;font-weight:700;min-height:0;padding:0 4px;text-decoration:underline}
.day-head{padding:14px 16px}
.day-head .top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.day-head .name{font-size:18px;font-weight:700}.day-head .date{font-size:15px;color:var(--muted);margin-left:8px}
.day-head .nums{display:flex;gap:14px;align-items:baseline}
.day-head .hours,.day-head .pay{font-size:18px;min-width:0}
.day-head .line{font-size:16px;line-height:1.4;margin-top:6px;color:var(--text);overflow-wrap:anywhere}
.totals .big{font-size:22px}
#totMonth{background:var(--bg);border-radius:10px;padding:12px 14px;margin-top:12px;font-size:16px;line-height:1.5}
.editor label{font-size:14px}
header{display:flex;align-items:center;gap:12px}.logo{width:38px;height:38px;border-radius:9px;flex:none}
textarea{overflow:hidden}#f-clients{min-height:150px}#f-purch{min-height:84px}
.chips{display:block}.chiprow{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chips button.fx{background:var(--navy);color:#fff;border-color:var(--navy)}
.chips button.rc{border-color:var(--green);color:var(--green)}
@media (prefers-color-scheme:dark){.chips button.fx{background:#2c5a94;border-color:#2c5a94}}
.day.appendix{margin-left:22px;border-style:dashed}
.day.appendix .name::before{content:"\21B3  ";color:var(--muted);font-weight:400}
.cash{background:var(--bg);border-radius:10px;padding:12px 14px;margin-top:12px;line-height:1.45}
.cash .main{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:16px;font-weight:700}
.cash .main b{color:var(--green);font-size:21px}
.cash .sub{font-size:13px;color:var(--muted);margin-top:3px}
</style>
</head>
<body>
<header>
  <img src="icon-192.png" alt="" class="logo"><h1>Werkuren test</h1>
</header>
<main>

  <div class="card">
    <div class="weeknav">
      <button id="prev" aria-label="Vorige week">&#9664;</button>
      <div class="label" id="weekLabel"></div>
      <button id="next" aria-label="Volgende week">&#9654;</button>
    </div>
    <button class="today-btn" id="thisWeek">Deze week</button>
  </div>

  <div id="days"></div>

  <div class="card">
    <div class="totals">
      <div class="big" id="totHours">Totaal uren: 0,00</div>
      <div class="big pay" id="totPay"></div>
    </div>
    <div id="totCash" class="cash" hidden></div>
    <div id="totMonth" style="margin-top:8px;font-weight:600"></div>
    <div class="hint" id="totBuy"></div>
    <div class="rate-row">
      <span>Uurloon</span>
      <input id="rate" inputmode="decimal" value="13,00" aria-label="Uurloon in euro">
      <span>&euro;/uur</span>
    </div>
  </div>

  <div class="card sync">
    <div class="btns">
      <button class="primary" id="share">Naar pc sturen</button>
      <button id="copy">Kopieer als tekst</button>
    </div>
    <p id="lastExport" style="margin-top:10px;margin-bottom:0"></p>
  </div>
<div class="card sync">
    <div class="btns"><button id="restore">Herstel van pc&hellip;</button></div>
    <input type="file" id="restoreFile" accept=".json,application/json" hidden>
  </div>
<div class="card sync">
    <div class="btns" id="pairRow"><input id="pairCode" placeholder="Koppelcode van de pc" autocapitalize="characters" autocomplete="off" spellcheck="false"><button id="pairBtn" class="primary">Koppel</button></div>
    <p id="pairStatus" style="margin:6px 0 0"></p>
    <button class="link" id="pcForce" style="display:none">Gewiste pc-dagen terugzetten</button>
    <button class="link" id="unpair" style="display:none">Ontkoppelen</button>
  </div>
</main>
<div class="toast" id="toast"></div>

<script>
"use strict";
const STORE_KEY = "werkuren-test.v1";   // eigen opslag: raakt de gewone Werkuren-app niet aan
const DAY_NAMES = ["Maandag","Dinsdag","Woensdag","Donderdag","Vrijdag","Zaterdag","Zondag"];   // zondag = bijlage bij zaterdag

/* ---------- opslag ---------- */
let state = { records: {}, deleted: {}, rate: 13, lastExport: null, deposits: {}, corrections: {} };
/* Storting per maand en afstemmingen komen van de pc (die is de baas); de telefoon rekent er alleen mee. */
function cleanDeposits(raw) {
  const out = {};
  if (raw && typeof raw === "object") Object.keys(raw).sort().forEach(k => {
    const v = +raw[k];
    if (/^\d{4}-(0[1-9]|1[0-2])$/.test(k) && isFinite(v) && v >= 0) out[k] = v;
  });
  return out;
}
function cleanCorrections(raw) {
  const out = {};
  if (raw && typeof raw === "object") Object.keys(raw).sort().forEach(k => {
    const v = +raw[k];
    if (/^\d{4}-\d{2}-\d{2}$/.test(k) && isFinite(v) && Math.abs(v) <= 1e6) out[k] = Number(v.toFixed(2));
  });
  return out;
}
function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const p = JSON.parse(raw);
      state.records = p.records || {};
      state.deleted = p.deleted || {};
      state.deposits = cleanDeposits(p.deposits); state.corrections = cleanCorrections(p.corrections);
      state.pair = p.pair || ""; state.fp = p.fp || ""; state.lastPc = p.lastPc || ""; state.dirty = !!p.dirty; state.lastSent = p.lastSent || null;
      state.rate = typeof p.rate === "number" ? p.rate : 13;
      state.lastExport = p.lastExport || null;
    }
  } catch (e) { /* lege start */ }
}
function saveState() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); return true; }
  catch (e) { toast("Opslaan mislukt. Is de opslag vol of geblokkeerd?"); return false; }
}

/* ---------- datum helpers ---------- */
const pad = n => String(n).padStart(2, "0");
function iso(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function mondayOf(d) {
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const wd = (x.getDay() + 6) % 7;           // maandag = 0
  x.setDate(x.getDate() - wd);
  return x;
}
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function fmt(d) { return pad(d.getDate()) + "-" + pad(d.getMonth() + 1) + "-" + d.getFullYear(); }
function fmtShort(d) { return pad(d.getDate()) + "-" + pad(d.getMonth() + 1); }

/* ---------- tijd en uren: zelfde regels als de pc-app ---------- */
function parseTime(v) {
  v = (v || "").trim();
  if (!v) return null;
  let m = v.match(/^(\d{1,2})$/);
  if (m) { const h = +m[1]; if (h >= 0 && h <= 23) return h * 60; }
  m = v.match(/^(\d{1,2})[:.](\d{2})$/);
  if (m) { const h = +m[1], mi = +m[2]; if (h >= 0 && h <= 23 && mi >= 0 && mi <= 59) return h * 60 + mi; }
  throw new Error("Ongeldig tijdstip: " + v);
}
function hoursBetween(s, e) {
  let a, b;
  try { a = parseTime(s); b = parseTime(e); } catch (err) { return 0; }
  if (a === null || b === null) return 0;
  let min = b - a;
  if (min < 0) min += 24 * 60;
  return min / 60;
}
const nl = (n, dec = 2) => n.toFixed(dec).replace(".", ",");

/* ---------- parsing van de tekstvelden: zelfde regels als de pc-app ---------- */
function parseClients(text) {
  const out = [];
  text.split(/\r?\n/).forEach(line => {
    line = line.trim();
    if (!line) return;
    const name = line.split("|")[0].trim();
    if (name) out.push({ name: name, materials: "" });
  });
  return out;
}
function parsePurchases(text) {
  const out = [];
  text.split(/\r?\n/).forEach(line => {
    line = line.trim();
    if (!line) return;
    const m = line.match(/^(.*?)\s+([0-9]+(?:[.,][0-9]{1,2})?)\s*€?$/);
    if (m && m[1].trim()) {
      const amount = parseFloat(m[2].replace(",", "."));
      if (!isNaN(amount) && amount >= 0) out.push({ store: m[1].trim(), amount: amount });
    }
  });
  return out;
}

/* ---------- weergave ---------- */
let weekStart = mondayOf(new Date());
let selected = iso(new Date());
if (!isInWeek(selected)) selected = iso(weekStart);
function isInWeek(key) {
  for (let i = 0; i < 7; i++) if (iso(addDays(weekStart, i)) === key) return true;
  return false;
}

const $ = id => document.getElementById(id);
function recOf(key) { return state.records[key] || { start: "", end: "", clients: [], purchases: [] }; }

const eur = n => { const [a, b] = n.toFixed(2).split("."); return "€ " + a.replace(/\B(?=(\d{3})+(?!\d))/g, ".") + "," + b; };

/* ---------- storting en cash: zelfde berekening als de pc-app ---------- */
const MONTHS_NL = ["januari","februari","maart","april","mei","juni","juli","augustus","september","oktober","november","december"];
const monthStart = (y, m) => new Date(y, m - 1, 1);
function depositFor(y, m) {                       // eigen waarde van die maand, anders de laatste eerdere, anders 0
  const k = y + "-" + pad(m), dep = state.deposits || {};
  if (k in dep) return dep[k];
  let best = null;
  for (const x in dep) if (x < k && (best === null || x > best)) best = x;
  return best === null ? 0 : dep[best];
}
function dayHours(key) { const r = state.records[key]; return r ? hoursBetween(r.start, r.end) : 0; }
function monthEarned(y, m, upto) {                // verdiend uit uren in die maand, t/m 'upto' (Date) of de hele maand
  let last = new Date(y, m, 0).getDate();
  if (upto) {
    if (upto < monthStart(y, m)) return 0;
    if (upto.getFullYear() === y && upto.getMonth() + 1 === m) last = upto.getDate();
  }
  let h = 0;
  for (let d = 1; d <= last; d++) h += dayHours(y + "-" + pad(m) + "-" + pad(d));
  return h * state.rate;
}
function corrTotal(y, m, upto) {                  // afstemmingen van de pc in die maand, t/m 'upto'
  const pre = y + "-" + pad(m) + "-", lim = upto ? iso(upto) : "9999-99-99";
  let t = 0;
  for (const k in state.corrections) if (k.startsWith(pre) && k <= lim) t += state.corrections[k];
  return t;
}
const hasCorr = (y, m) => Object.keys(state.corrections).some(k => k.startsWith(y + "-" + pad(m) + "-"));
function cashDueMonth(y, m, upto) {
  if (upto && upto < monthStart(y, m)) return 0;
  return Math.max(0, monthEarned(y, m, upto) + corrTotal(y, m, upto) - depositFor(y, m));
}
function monthsIn(a, b) {
  const out = [];
  for (let d = new Date(a); d <= b; d = addDays(d, 1)) {
    const y = d.getFullYear(), m = d.getMonth() + 1;
    if (!out.some(x => x[0] === y && x[1] === m)) out.push([y, m]);
  }
  return out;
}
function weekCash(a, b) {                         // cash voor de uren van a t/m b: toename van (verdiend - storting)
  let t = 0;
  monthsIn(a, b).forEach(([y, m]) => { t += cashDueMonth(y, m, b) - cashDueMonth(y, m, addDays(a, -1)); });
  return Number(t.toFixed(2));
}
const hasCashEffect = (y, m) => depositFor(y, m) > 0 || hasCorr(y, m);
const esc = t => String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function headHTML(i, d, rec) {
  const h = hoursBetween(rec.start, rec.end);
  const cl = (rec.clients || []).map(c => typeof c === "object" ? c.name : c).filter(Boolean).join(", ");
  const pu = (rec.purchases || []).map(p => (p.store + " " + eur(+p.amount || 0)).trim()).join("; ");
  const t = rec.start || rec.end ? (rec.start || "—") + " – " + (rec.end || "—") : "";
  return '<div class="top"><div><span class="name">' + DAY_NAMES[i] + '</span><span class="date">' + fmtShort(d) + '</span></div>' +
    '<div class="nums"><span class="hours' + (h ? "" : " zero") + '">' + (h ? nl(h) + " u" : "—") + '</span><span class="pay">' + (h ? eur(h * state.rate) : "") + '</span></div></div>' +
    (t ? '<div class="line">🕐 ' + t + '</div>' : "") + (cl ? '<div class="line">👤 ' + esc(cl) + '</div>' : "") + (pu ? '<div class="line">🧾 ' + esc(pu) + '</div>' : "");
}
function updateTotals() {
  let h = 0, p = 0;
  for (let i = 0; i < 7; i++) {
    const rec = recOf(iso(addDays(weekStart, i)));
    h += hoursBetween(rec.start, rec.end);
    (rec.purchases || []).forEach(x => { p += +x.amount || 0; });
  }
  $("totHours").textContent = "Totaal uren: " + nl(h);
  $("totPay").textContent = "Week: " + eur(h * state.rate);
  $("totBuy").textContent = p ? "Aankopen deze week: " + eur(p) : "";
  const we = addDays(weekStart, 6), cashMonths = monthsIn(weekStart, we).filter(([y, m]) => hasCashEffect(y, m)), box = $("totCash");
  if (!cashMonths.length) box.hidden = true;
  else {
    const cashH = weekCash(weekStart, we);
    const parts = cashMonths.map(([y, m]) => { const c = corrTotal(y, m, we);
      return MONTHS_NL[m - 1] + ": verdiend " + eur(monthEarned(y, m, we)) + (c ? (c > 0 ? " + " : " − ") + "correctie " + eur(Math.abs(c)) : "") + " − gestort " + eur(depositFor(y, m)); });
    box.hidden = false;
    box.innerHTML = '<div class="main"><span>Te ontvangen deze week</span><b>' + eur(cashH + p) + '</b></div>' +
      '<div class="sub">uren ' + eur(cashH) + ' + aankopen ' + eur(p) + '</div>' + parts.map(t => '<div class="sub">' + esc(t) + '</div>').join("");
  }
  const ref = selected && isInWeek(selected) ? selected : iso(weekStart), pre = ref.slice(0, 7);
  let mh = 0, mp = 0, md = 0;
  for (const k in state.records) if (k.startsWith(pre)) {
    const r = state.records[k], x = hoursBetween(r.start, r.end);
    mh += x; if (x) md++;
    (r.purchases || []).forEach(y => { mp += +y.amount || 0; });
  }
  const mn = new Date(+pre.slice(0, 4), +pre.slice(5, 7) - 1, 1).toLocaleString("nl-BE", { month: "long", year: "numeric" });
  const py = +pre.slice(0, 4), pm = +pre.slice(5, 7);
  $("totMonth").innerHTML = "<b>" + mn + "</b><br>" + nl(mh) + " uur &middot; " + eur(mh * state.rate) + "<br>" + md + " dagen" + (mp ? " &middot; aankopen " + eur(mp) : "") +
    (hasCashEffect(py, pm) ? "<br>gestort " + eur(depositFor(py, pm)) + " &middot; cash te ontvangen " + eur(cashDueMonth(py, pm)) : "");
}
function render() {
  $("weekLabel").textContent = fmt(weekStart) + "  t/m  " + fmt(addDays(weekStart, 6));
  const wrap = $("days"); wrap.innerHTML = "";
  const todayKey = iso(new Date());
  for (let i = 0; i < 7; i++) {
    const d = addDays(weekStart, i), key = iso(d), rec = recOf(key), open = key === selected;
    const box = document.createElement("div");
    box.className = "day" + (open ? " open" : "") + (key === todayKey ? " today" : "") + (i === 6 ? " appendix" : "");
    const head = document.createElement("button");
    head.className = "day-head"; head.innerHTML = headHTML(i, d, rec);
    head.addEventListener("click", () => { flush(); selected = open ? null : key; render(); });
    box.appendChild(head);
    if (open) box.appendChild(buildEditor(key, rec));
    wrap.appendChild(box);
  }
  updateTotals();
  $("rate").value = nl(state.rate);
  $("lastExport").textContent = state.lastExport ? "Laatst gedeeld: " + new Date(state.lastExport).toLocaleString("nl-BE") : "";
}

/* ---------- editor ---------- */
let saveTimer = null, editorRefs = null;
function buildEditor(key, rec) {
  const ed = document.createElement("div");
  ed.className = "editor";
  const isSun = new Date(+key.slice(0, 4), +key.slice(5, 7) - 1, +key.slice(8, 10)).getDay() === 0;
  const clientsDraft = rec.clients_text !== undefined ? rec.clients_text
    : (rec.clients || []).map(c => (typeof c === "object" ? c.name : c)).join("\n");
  const purchasesDraft = rec.purchases_text !== undefined ? rec.purchases_text
    : (rec.purchases || []).map(p => (p.store + " " + String(p.amount).replace(".", ",")).trim()).join("\n");

  ed.innerHTML =
    '<div class="row2">' +
      '<div><label for="f-start">Beginuur</label><input id="f-start" inputmode="decimal" autocomplete="off"></div>' +
      '<div><label for="f-end">Einduur</label><input id="f-end" inputmode="decimal" autocomplete="off"></div>' +
    '</div>' +
    '<div class="err" id="f-err"></div>' +
    (isSun ? '<div class="hint">Zondag hoort bij de week van zaterdag: de uren tellen mee in het weektotaal en staan op het formulier bij zaterdag.</div>' : '') +
    '<label for="f-clients">Klanten</label>' +
    '<textarea id="f-clients" autocapitalize="words"></textarea><div class="chips" id="f-chips"></div>' +
    '<label for="f-purch">Aankopen</label>' +
    '<textarea id="f-purch"></textarea>' +
    '' +
    '<div class="saved"><span id="f-saved">Automatisch bewaard</span><button class="link" id="f-clear">Dag leegmaken</button></div>';

  const q = id => ed.querySelector(id);
  q("#f-start").value = rec.start || "";
  q("#f-end").value = rec.end || "";
  q("#f-clients").value = clientsDraft;
  q("#f-purch").value = purchasesDraft;
  editorRefs = { key, start: q("#f-start"), end: q("#f-end"), clients: q("#f-clients"), purch: q("#f-purch"),
                 err: q("#f-err"), saved: q("#f-saved"), chips: q("#f-chips") };

  ["start", "end", "clients", "purch"].forEach(k => editorRefs[k].addEventListener("input", schedule));
  ["input", "focus"].forEach(ev => editorRefs.clients.addEventListener(ev, renderChips));
  ["start", "end"].forEach(k => editorRefs[k].addEventListener("change", () => { editorRefs[k].value = normTime(editorRefs[k].value); schedule(); }));
  renderChips();
  const tas = [q("#f-clients"), q("#f-purch")];
  tas.forEach(t => t.addEventListener("input", () => grow(t)));
  requestAnimationFrame(() => tas.forEach(grow));
  q("#f-clients").addEventListener("focus", e => {
    const t = e.target;
    if (t.value && !t.value.endsWith("\n")) { t.value += "\n"; grow(t); renderChips(); }
  });
  q("#f-clear").addEventListener("click", () => {
    const key = editorRefs.key, prevTomb = state.deleted[key];
    const prev = state.records[key] ? JSON.parse(JSON.stringify(state.records[key])) : null;
    editorRefs.start.value = editorRefs.end.value = editorRefs.clients.value = editorRefs.purch.value = "";
    flush(true, true); renderChips();
    toast("Dag leeggemaakt.", "Ongedaan maken", () => {
      if (prev) { prev.updated = new Date().toISOString(); state.records[key] = prev; delete state.deleted[key]; }
      else if (prevTomb) state.deleted[key] = prevTomb; else delete state.deleted[key];
      markDirty(); saveState(); render();
    }, 9000);
  });
  return ed;
}

const FIXED = ["laden magazijn", "laden winkel", "lossen magazijn", "winkel magazijn", "vuil afvoeren"];
function topNames(keys) {
  const m = {};
  keys.forEach(k => (state.records[k].clients || []).forEach(c => {
    const n = String(typeof c === "object" ? c.name : c || "").trim(), l = n.toLowerCase();
    if (n) (m[l] = m[l] || { n: n, c: 0 }).c++;
  }));
  return Object.values(m).sort((a, b) => b.c - a.c || a.n.localeCompare(b.n)).map(x => x.n);
}
function grow(el) { el.style.height = "auto"; el.style.height = el.scrollHeight + "px"; }
function renderChips() {
  const r = editorRefs; if (!r) return;
  const lines = r.clients.value.split("\n"), last = lines[lines.length - 1].trim().toLowerCase();
  const have = new Set(lines.slice(0, -1).map(l => l.split("|")[0].trim().toLowerCase()));
  const keys = Object.keys(state.records).sort().reverse();
  const all = topNames(keys);
  const recent = topNames(keys.filter(k => { const x = state.records[k]; return x.start || x.end || (x.clients || []).length; }).slice(0, 7));
  const shown = new Set(have);
  const take = (list, max, cls) => {
    const out = [];
    for (const n of list) {
      const l = n.toLowerCase();
      if (shown.has(l) || (last && (l === last || !l.includes(last)))) continue;
      shown.add(l); out.push(n); if (out.length >= max) break;
    }
    return [cls, out];
  };
  const rows = last ? [take(FIXED.concat(all), 12, "")] : [take(FIXED, 5, "fx"), take(all, 5, "al"), take(recent, 5, "rc")];
  r.chips.innerHTML = "";
  rows.forEach(([cls, names]) => {
    if (!names.length) return;
    const row = document.createElement("div"); row.className = "chiprow";
    names.forEach(n => {
      const b = document.createElement("button"); b.type = "button"; b.className = cls; b.textContent = n;
      b.addEventListener("click", () => {
        lines[lines.length - 1] = n; r.clients.value = lines.join("\n") + "\n";
        grow(r.clients); r.clients.focus(); schedule(); renderChips();
      });
      row.appendChild(b);
    });
    r.chips.appendChild(row);
  });
}
function schedule() {
  if (!editorRefs) return;
  editorRefs.saved.textContent = "Wijzigingen worden bewaard…";
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => flush(true), 500);
}

/* 830 / 8,30 / 8.30 worden 8:30 (het iOS-toetsenbord heeft geen dubbele punt) */
function normTime(v) {
  v = v.trim().replace(/[,.]/, ":");
  if (/^\d{3,4}$/.test(v)) v = v.slice(0, -2) + ":" + v.slice(-2);
  return v;
}
function flush(rerenderHeader, forceDeleteMark) {
  clearTimeout(saveTimer); saveTimer = null;
  const r = editorRefs;
  if (!r || !document.body.contains(r.start)) return;
  const start = normTime(r.start.value), end = normTime(r.end.value);
  const clientsText = r.clients.value, purchText = r.purch.value;

  let msg = "";
  try { parseTime(start); parseTime(end); } catch (e) { msg = e.message; }
  r.err.textContent = msg;

  const old = state.records[r.key];
  const isEmpty = !start && !end && !clientsText.trim() && !purchText.trim();
  if (isEmpty) {
    // Alleen een verwijdermarkering als de dag op de telefoon bestond of expliciet is leeggemaakt.
    if (old || forceDeleteMark) { delete state.records[r.key]; state.deleted[r.key] = new Date().toISOString(); markDirty(); }
  } else {
    const unchanged = old && old.start === start && old.end === end &&
      (old.clients_text || "").trimEnd() === clientsText.trimEnd() && (old.purchases_text || "").trimEnd() === purchText.trimEnd();
    if (!unchanged) {
      state.records[r.key] = {
        start: start, end: end,
        clients: parseClients(clientsText), purchases: parsePurchases(purchText),
        clients_text: clientsText, purchases_text: purchText,
        updated: new Date().toISOString()
      };
      delete state.deleted[r.key]; markDirty();
    }
  }
  if (saveState()) r.saved.textContent = "Automatisch bewaard";
  if (rerenderHeader) refreshHeaders();
}

/* Alleen de kopregels en totalen vernieuwen, zodat het toetsenbord open blijft. */
function refreshHeaders() {
  const boxes = $("days").children;
  for (let i = 0; i < 7; i++) {
    const d = addDays(weekStart, i);
    boxes[i].querySelector(".day-head").innerHTML = headHTML(i, d, recOf(iso(d)));
  }
  updateTotals();
}

/* ---------- navigatie ---------- */
function goWeek(days) {
  flush();
  weekStart = addDays(weekStart, days);
  selected = iso(weekStart);
  render();
}
$("prev").addEventListener("click", () => goWeek(-7));
$("next").addEventListener("click", () => goWeek(7));
$("thisWeek").addEventListener("click", () => {
  flush();
  weekStart = mondayOf(new Date());
  const t = iso(new Date());
  selected = isInWeek(t) ? t : iso(weekStart);
  render();
});
$("rate").addEventListener("change", () => {
  const v = parseFloat($("rate").value.replace("€", "").replace(",", "."));
  if (!isNaN(v) && v >= 0 && v <= 100000) { state.rate = v; saveState(); }
  render();
});

/* ---------- export naar pc ---------- */
function buildExport() {
  flush();
  const recs = {};
  Object.keys(state.records).sort().forEach(k => { recs[k] = state.records[k]; });
  return JSON.stringify({ format: "werkuren-telefoon", version: 1, exported: new Date().toISOString(), records: recs, deleted: state.deleted }, null, 2);
}
function markExported() { state.lastExport = new Date().toISOString(); saveState(); $("lastExport").textContent = "Laatst gedeeld: " + new Date(state.lastExport).toLocaleString("nl-BE"); }

$("share").addEventListener("click", async () => {
  const json = buildExport();
  const name = "uren-telefoon-" + iso(new Date()) + ".json";
  const file = new File([json], name, { type: "application/json" });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: "Werkuren" });
      markExported();
      return;
    }
  } catch (e) {
    if (e && e.name === "AbortError") return;      // gebruiker annuleerde
  }
  // Terugval: gewoon downloaden
  const url = URL.createObjectURL(new Blob([json], { type: "application/json" }));
  const a = document.createElement("a");
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  markExported();
  toast("Bestand bewaard: " + name);
});

$("copy").addEventListener("click", async () => {
  const json = buildExport();
  try { await navigator.clipboard.writeText(json); markExported(); toast("Gekopieerd."); }
  catch (e) { toast("Kopiëren mislukt."); }
});

/* ---------- herstellen van pc-snapshot ---------- */
$("restore").addEventListener("click", () => $("restoreFile").click());
$("restoreFile").addEventListener("change", async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try {
    flush();
    const d = JSON.parse(await f.text());
    if (d.format !== "werkuren-pc" || typeof d.records !== "object") throw 0;
    const keys = Object.keys(d.records).filter(k => !state.records[k] && !state.deleted[k]);
    if (!confirm(keys.length + " dag(en) terugzetten?")) return;
    keys.forEach(k => {
      const r = d.records[k];
      state.records[k] = { start: r.start || "", end: r.end || "", clients: r.clients || [], purchases: r.purchases || [],
        clients_text: r.clients_text ?? (r.clients || []).map(c => c.name || c).join("\n"),
        purchases_text: r.purchases_text ?? (r.purchases || []).map(p => (p.store + " " + String(p.amount).replace(".", ",")).trim()).join("\n"),
        updated: d.written || new Date().toISOString() };
    });
    if (typeof d.rate === "number") state.rate = d.rate;
    if (d.deposits && typeof d.deposits === "object") state.deposits = cleanDeposits(d.deposits);
    if (d.corrections && typeof d.corrections === "object") state.corrections = cleanCorrections(d.corrections);
    saveState(); render(); toast(keys.length + " dag(en) hersteld.");
  } catch (err) { toast("Dit is geen geldig pc-bestand."); }
});

/* ---------- live synchronisatie via ntfy (versleuteld) ---------- */
const NTFY = "https://ntfy.sh/", WINDOW_DAYS = 28, CHUNK = 3000;
/*CRYPTO-START*/
const enc = new TextEncoder();
const b64 = u8 => { let s = ""; for (let i = 0; i < u8.length; i += 8192) s += String.fromCharCode.apply(null, u8.subarray(i, i + 8192)); return btoa(s); };
const cat = (...a) => { const o = new Uint8Array(a.reduce((n, x) => n + x.length, 0)); let p = 0; a.forEach(x => { o.set(x, p); p += x.length; }); return o; };
async function hmac(key, data) {
  const k = await crypto.subtle.importKey("raw", key, { name: "HMAC", hash: "SHA-256" }, false, ["sign"]);
  return new Uint8Array(await crypto.subtle.sign("HMAC", k, data));
}
async function derive(code, sfx = "") {
  const sec = enc.encode(code), t = await hmac(sec, enc.encode("topic" + sfx));
  return { topic: "wu-" + Array.from(t.slice(0, 16), x => x.toString(16).padStart(2, "0")).join(""),
           kEnc: await hmac(sec, enc.encode("enc" + sfx)), kMac: await hmac(sec, enc.encode("mac" + sfx)) };
}
async function seal(kEnc, kMac, plain) {
  const nonce = crypto.getRandomValues(new Uint8Array(16)), ct = new Uint8Array(plain.length);
  for (let i = 0; i * 32 < plain.length; i++) {
    const ks = await hmac(kEnc, cat(nonce, new Uint8Array([i >>> 24, (i >>> 16) & 255, (i >>> 8) & 255, i & 255])));
    for (let j = 0; j < 32 && i * 32 + j < plain.length; j++) ct[i * 32 + j] = plain[i * 32 + j] ^ ks[j];
  }
  return cat(nonce, await hmac(kMac, cat(nonce, ct)), ct);
}
async function gzip(str) {
  return new Uint8Array(await new Response(new Blob([str]).stream().pipeThrough(new CompressionStream("gzip"))).arrayBuffer());
}
async function pack(json, code) {
  const { topic, kEnc, kMac } = await derive(code);
  let raw = enc.encode(json); try { raw = await gzip(json); } catch (e) {}
  const blob = b64(await seal(kEnc, kMac, raw)), id = crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2);
  const n = Math.ceil(blob.length / CHUNK), msgs = [];
  for (let k = 0; k < n; k++) msgs.push(JSON.stringify({ i: id, k: k, n: n, d: blob.slice(k * CHUNK, (k + 1) * CHUNK) }));
  return { topic, msgs };
}
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function gunzip(u8) {
  return new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(new DecompressionStream("gzip"))).arrayBuffer());
}
async function unseal(kEnc, kMac, raw) {
  if (raw.length < 49) throw new Error("kort");
  const nonce = raw.slice(0, 16), tag = raw.slice(16, 48), ct = raw.slice(48), exp = await hmac(kMac, cat(nonce, ct));
  let bad = 0; for (let i = 0; i < 32; i++) bad |= exp[i] ^ tag[i];
  if (bad) throw new Error("handtekening");
  const out = new Uint8Array(ct.length);
  for (let i = 0; i * 32 < ct.length; i++) {
    const ks = await hmac(kEnc, cat(nonce, new Uint8Array([i >>> 24, (i >>> 16) & 255, (i >>> 8) & 255, i & 255])));
    for (let j = 0; j < 32 && i * 32 + j < ct.length; j++) out[i * 32 + j] = ct[i * 32 + j] ^ ks[j];
  }
  const plain = out[0] === 0x1f && out[1] === 0x8b ? await gunzip(out) : out;
  return JSON.parse(new TextDecoder().decode(plain));
}
/*CRYPTO-END*/
function buildWindow() {
  const lim = new Date(); lim.setDate(lim.getDate() - WINDOW_DAYS);
  const limK = iso(lim), limT = lim.toISOString(), recs = {}, del = {};
  for (const k in state.records) if (k >= limK || (state.records[k].updated || "") >= limT) recs[k] = state.records[k];
  for (const k in state.deleted) if (k >= limK || state.deleted[k] >= limT) del[k] = state.deleted[k];
  return JSON.stringify({ format: "werkuren-telefoon", version: 1, exported: new Date().toISOString(), records: recs, deleted: del });
}
let sending = false, sendTimer = null, rev = 0;
function markDirty() {
  if (!state.pair) return;
  rev++; state.dirty = true; saveState();
  clearTimeout(sendTimer); sendTimer = setTimeout(() => trySend(), 4000); setPairStatus();
}
async function trySend(force) {
  if (!state.pair || sending || (!state.dirty && !force)) return;
  flush(); const r0 = rev; sending = true; setPairStatus("Verzenden…");
  try {
    const { topic, msgs } = await pack(buildWindow(), state.pair);
    for (const m of msgs) { const r = await fetch(NTFY + topic, { method: "POST", body: m }); if (!r.ok) throw new Error("HTTP " + r.status); }
    if (rev === r0) state.dirty = false;
    state.lastSent = new Date().toISOString(); saveState();
  } catch (e) { state.dirty = true; saveState(); }
  sending = false; setPairStatus();
}
/*MERGE-START*/
function mergePc(d, force, busyKey) {
  let n = 0, skipDel = 0;
  for (const k in d.records) {
    if (k === busyKey) continue;                                        // dag waar je nu in typt: later
    const r = d.records[k], ru = r.updated || "";
    if (!force && state.deleted[k] && state.deleted[k] >= ru) { skipDel++; continue; }   // op de telefoon gewist
    const cur = state.records[k];
    if (cur && (cur.updated || "") >= ru) continue;                     // telefoon is nieuwer of gelijk
    const same = cur && JSON.stringify([cur.start, cur.end, cur.clients, cur.purchases]) === JSON.stringify([r.start || "", r.end || "", r.clients || [], r.purchases || []]);
    state.records[k] = { start: r.start || "", end: r.end || "", clients: r.clients || [], purchases: r.purchases || [],
      clients_text: r.clients_text ?? (r.clients || []).map(c => c.name || c).join("\n"),
      purchases_text: r.purchases_text ?? (r.purchases || []).map(p => (p.store + " " + String(p.amount).replace(".", ",")).trim()).join("\n"),
      updated: ru || d.written };
    delete state.deleted[k];
    if (!same) n++;
  }
  if (typeof d.rate === "number") state.rate = d.rate;
  let cash = false;                                               // storting/afstemmingen: de pc is de baas
  if (d.deposits && typeof d.deposits === "object") {
    const nd = cleanDeposits(d.deposits);
    if (JSON.stringify(nd) !== JSON.stringify(state.deposits)) { state.deposits = nd; cash = true; }
  }
  if (d.corrections && typeof d.corrections === "object") {
    const nc = cleanCorrections(d.corrections);
    if (JSON.stringify(nc) !== JSON.stringify(state.corrections)) { state.corrections = nc; cash = true; }
  }
  return { n, skipDel, cash };
}
/*MERGE-END*/
let pulling = false, pullNote = "", skipDelCount = 0;
async function pullPc(force) {
  if (!state.pair || pulling || document.visibilityState !== "visible") return;
  const a = document.activeElement;
  const typing = !!(a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA") && editorRefs && document.body.contains(editorRefs.start));
  pulling = true;
  try {
    const { topic, kEnc, kMac } = await derive(state.pair, "-pc");
    const r = await fetch(NTFY + topic + "/json?poll=1&since=all");
    if (!r.ok) throw new Error("HTTP " + r.status);
    const groups = {};
    (await r.text()).split("\n").forEach(line => {
      try {
        const ev = JSON.parse(line); if (ev.event !== "message") return;
        const m = JSON.parse(ev.message); (groups[m.i] = groups[m.i] || { n: m.n, p: {} }).p[m.k] = m.d;
      } catch (e) {}
    });
    let best = null;
    const ids = Object.keys(groups);
    for (const id of ids) {
      const g = groups[id]; if (Object.keys(g.p).length !== g.n) continue;
      try {
        const d = await unseal(kEnc, kMac, unb64(Array.from({ length: g.n }, (_, i) => g.p[i]).join("")));
        if (d.format === "werkuren-pc" && (!best || d.written > best.written)) best = d;
      } catch (e) {}
    }
    if (!ids.length) pullNote = "geen bericht van de pc gevonden";
    else if (!best) pullNote = "pc-bericht niet te ontcijferen";
    else {
      const m = mergePc(best, force, typing ? editorRefs.key : null);
      skipDelCount = m.skipDel; state.lastPc = best.written; saveState();
      if (m.n || m.cash) { if (typing) refreshHeaders(); else render(); }
      if (m.n) toast(m.n + " dag(en) van de pc");
      pullNote = "pc " + new Date(best.written).toLocaleTimeString("nl-BE", { hour: "2-digit", minute: "2-digit" }) +
        ": " + m.n + " bijgewerkt" + (m.skipDel ? ", " + m.skipDel + " eerder gewist" : "");
    }
  } catch (e) { pullNote = "pc: fout (" + (e && e.message ? e.message : e) + ")"; }
  pulling = false; setPairStatus();
}
function maybeSend() {
  if (state.pair && (state.dirty || !state.lastSent || Date.now() - Date.parse(state.lastSent) > 600000)) trySend(true);
}
function setPairStatus(t) {
  $("pairRow").style.display = state.pair ? "none" : "flex";
  $("unpair").style.display = state.pair ? "" : "none";
  $("pcForce").style.display = state.pair && skipDelCount ? "" : "none";
  const base = !state.pair ? "" : t || (state.dirty ? "Wacht op verzending…"
    : (state.lastSent ? "Verzonden " + new Date(state.lastSent).toLocaleTimeString("nl-BE") : "Gekoppeld") + (state.fp ? " • controlegetal " + state.fp : ""));
  $("pairStatus").textContent = base + (state.pair && pullNote ? " • " + pullNote : "");
}
$("pairBtn").addEventListener("click", () => {
  const c = $("pairCode").value.toUpperCase().replace(/[^A-Z0-9]/g, "");
  if (c.length !== 24) { toast("Code heeft " + c.length + " tekens, het moeten er 24 zijn."); return; }
  if (!/^[A-HJKMNP-Z2-9]{24}$/.test(c)) { toast("De code bevat een ongeldig teken (geen 0, 1, O, I of L)."); return; }
  state.pair = c; state.fp = ""; state.dirty = true; saveState(); $("pairCode").value = "";
  derive(c).then(d => { state.fp = d.topic.slice(3, 9); saveState(); setPairStatus(); });
  setPairStatus(); trySend(true);
});
$("unpair").addEventListener("click", () => {
  if (confirm("Ontkoppelen?")) { state.pair = ""; saveState(); setPairStatus(); }
});
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { maybeSend(); pullPc(); } });
window.addEventListener("online", () => trySend());
$("pcForce").addEventListener("click", () => pullPc(true));
setInterval(() => { if (state.dirty) trySend(); }, 60000);
setInterval(pullPc, 30000);

/* ---------- toast + start ---------- */
let toastTimer;
function toast(t, label, fn, ms) {
  const el = $("toast"); el.textContent = t; el.classList.remove("act");
  if (label) {
    const b = document.createElement("button"); b.textContent = label;
    b.addEventListener("click", () => { el.classList.remove("show", "act"); fn(); });
    el.appendChild(b); el.classList.add("act");
  }
  el.classList.add("show"); clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show", "act"), ms || 3200);
}
window.addEventListener("pagehide", () => flush());
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flush(); });

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});

loadState();
render();
if (state.pair && !state.fp) derive(state.pair).then(d => { state.fp = d.topic.slice(3, 9); saveState(); setPairStatus(); });
setPairStatus();
maybeSend();
pullPc();
</script>
